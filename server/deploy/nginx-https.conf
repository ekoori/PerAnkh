# Per Ankh API. A DNS-only name pointing straight at this server, so TLS ends here and no proxy
# in between sees a report. Other sites on this server have their own files; nothing here
# changes them.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/perankh-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Any other name asked for on port 443 is refused during the TLS handshake, so this site can never
# answer for another domain on this server.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:perankh_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # No access log: nothing records who sent a report. Errors only, rotated by logrotate.
    access_log off;
    error_log /var/log/nginx/perankh-error.log warn;

    client_max_body_size 256k;
    client_body_timeout 15s;
    send_timeout 15s;

    location = /v1/reports {
        limit_except POST { deny all; }
        limit_req zone=perankh_reports burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /v1/health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /privacy {
        alias /opt/perankh/static/privacy.html;
        default_type text/html;
        charset utf-8;
    }

    location / {
        return 404;
    }
}
