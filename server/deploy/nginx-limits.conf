# Per Ankh: at most 10 report uploads a minute from one address (each may carry 50 reports), and
# 30 looks at the newest release. The address is held in memory for rate limiting only and never
# written anywhere.
limit_req_zone $binary_remote_addr zone=perankh_reports:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=perankh_latest:1m rate=30r/m;
