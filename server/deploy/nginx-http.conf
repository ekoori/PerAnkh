# Per Ankh, before its certificate exists: answer Let's Encrypt's challenge and nothing else.
# install.sh replaces this with nginx-https.conf as soon as the certificate is issued.
# Other sites on this server have their own files; nothing here changes them.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/perankh-acme;
    }
    location / {
        return 404;
    }
}
